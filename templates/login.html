{% extends "base.html" %}
{% block title %}Login — WattWise{% endblock %}
{% block content %}
<section class="auth">
  <h1>Log in</h1>
  <form class="auth-form" method="post">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</section>
{% endblock %}
